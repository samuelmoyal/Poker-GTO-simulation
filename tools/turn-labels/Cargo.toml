[package]
name = "turn-labels"
version = "0.1.0"
edition = "2021"
description = "Solve turn-root states with postflop-solver and print per-hand EVs (labels for the value net)"

[dependencies]
postflop-solver = { path = "../postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
